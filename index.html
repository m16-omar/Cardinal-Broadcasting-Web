    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Cardinal Broadcasting Limited | Shaping the Future of Media</title>
    <meta name="title" content="Cardinal Broadcasting Limited | Shaping the Future of Media" />
    <meta name="description" content="Cardinal Broadcasting Limited is a dynamic Nigerian media organisation creating meaningful experiences through broadcasting, digital media, content, education and community engagement." />
    <meta name="keywords" content="Cardinal Broadcasting, Nigerian Media, Broadcasting Nigeria, City 105.1 FM, 93.5 Area FM, City Media Academy, Praise in the City, African Media Corporation" />
    <meta name="author" content="Cardinal Broadcasting Limited" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cardinalbroadcastingltd.com/" />
    <meta property="og:title" content="Cardinal Broadcasting Limited | Shaping the Future of Media" />
    <meta property="og:description" content="Broadcasting ideas. Building platforms. Empowering people. Cardinal Broadcasting Limited operates across broadcasting, digital content, media education, and audience experiences." />
    <meta property="og:image" content="https://cardinalbroadcastingltd.com/og-cardinal.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://cardinalbroadcastingltd.com/" />

    <!-- Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
    <!-- Theme Pre-hydration (Default: Light Mode) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cardinal_theme_v2');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F8F9FC] dark:bg-[#08090E] text-slate-900 dark:text-[#E2E8F0] font-sans antialiased selection:bg-[#9B111E] selection:text-white min-h-screen transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
